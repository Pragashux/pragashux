name: vibrant_lms
description: Vibrant LMS — enterprise Learning Management System for iOS and Android.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # UI & Design
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  fl_chart: ^0.70.2
  percent_indicator: ^4.2.4
  flutter_svg: ^2.0.17
  gap: ^3.0.1
  intl: ^0.20.2

  # State Management & Architecture
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7
  dartz: ^0.10.1
  get_it: ^8.0.3
  provider: ^6.1.2

  # Navigation
  go_router: ^14.8.1

  # Networking & Storage
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.2
  connectivity_plus: ^6.1.3

  # Firebase (configure with flutterfire configure)
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  firebase_storage: ^12.4.4
  firebase_messaging: ^15.2.4

  # Media & Learning
  video_player: ^2.9.3
  chewie: ^1.10.0
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  pdf: ^3.11.3
  printing: ^5.14.2

  # Forms & Validation
  flutter_form_builder: ^10.0.1
  form_builder_validators: ^11.1.2

  # Utils
  uuid: ^4.5.1
  collection: ^1.19.1
  logger: ^2.5.0
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  json_serializable: ^6.9.4
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/data/
